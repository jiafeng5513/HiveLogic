# docker-compose.sandbox.yml — AI 代码执行沙箱 sidecar
#
# 用法:
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#
# 安全约束:
#   - network_mode: none   — 沙箱容器完全无网络，无法数据出境
#   - read_only: true      — 根文件系统只读，仅 /tmp 可写（tmpfs）
#   - mem_limit: 1g        — 内存上限 1GB
#   - cpus: 0.5            — CPU 上限 0.5 核
#   - no-new-privileges    — 禁止提权
#   - 非 root 用户运行     — Dockerfile 中 USER sandbox
#
# 数据访问:
#   - 服务端 market_cache.db 以只读卷挂载到 /sandbox/data/market_cache.db
#   - 服务端 stock_analysis.db 以只读卷挂载到 /sandbox/data/stock_analysis.db
#   - 沙箱通过 hivelogic_data 模块只读访问

services:
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    container_name: hivelogic-sandbox
    # 无网络 — 从源头阻断数据出境
    network_mode: none
    # 只读根文件系统
    read_only: true
    # tmpfs 仅供临时输出
    tmpfs:
      - /tmp:size=256m,mode=1777
    # 资源限制
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.5
    # 安全加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 只读挂载服务端缓存数据
    volumes:
      # market_cache.db (K线/行情缓存) — 只读
      - hivelogic-data:/data:ro
      # 将 /data 中的缓存文件软链接到沙箱工作区（只读）
      # 沙箱内通过 hivelogic_data 模块访问 /sandbox/data/ 路径
    environment:
      - SANDBOX_DATA_DIR=/data
      - MPLBACKEND=Agg
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 10s
    profiles:
      - sandbox
